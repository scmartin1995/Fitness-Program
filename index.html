<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>AR-7 Hybrid Program</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AR-7"/>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════
     CSS VARIABLES (Tailwind Theme Mapping)
   ═══════════════════════════════════════ */
:root {
  --primary: #f3ffca;
  --primary-container: #cafd00;
  --on-primary-container: #4a5e00;
  --secondary: #00e3fd;
  --secondary-container: #006875;
  --background: #0e0e0e;
  --surface: #0e0e0e;
  --surface-container: #1a1a1a;
  --surface-container-low: #131313;
  --surface-container-high: #20201f;
  --surface-container-highest: #262626;
  --on-surface: #ffffff;
  --on-surface-variant: #adaaaa;
  --outline-variant: #484847;
  --error: #ff7351;
  
  --font-headline: 'Lexend', sans-serif;
  --font-body: 'Inter', sans-serif;
}

/* ═══════════════════════════════════════
     BASE STYLES
   ═══════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
  background-color: var(--background); 
  color: var(--on-surface); 
  font-family: var(--font-body);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  overflow-x: hidden;
}

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  display: inline-block; line-height: 1; vertical-align: middle;
}

/* ═══════════════════════════════════════
     LAYOUT & NAVIGATION
   ═══════════════════════════════════════ */
header.app-bar {
  position: fixed; top: 0; width: 100%; z-index: 50;
  background: rgba(10, 10, 10, 0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.5rem;
}

.tab-bar {
  position: fixed; top: 68px; left: 0; right: 0; z-index: 40;
  background: rgba(10, 10, 10, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.tabs-scroll {
  display: flex; overflow-x: auto; scrollbar-width: none;
  max-width: 42rem; margin: 0 auto;
}
.tabs-scroll::-webkit-scrollbar { display: none; }

.tab-btn {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  padding: 0.75rem 1rem; border: none; background: none; cursor: pointer;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
  border-bottom: 2px solid transparent; transition: all 0.2s;
}

main.content-area {
  padding: 120px 1rem 8rem 1rem;
  max-width: 42rem; margin: 0 auto;
}

/* ═══════════════════════════════════════
     COMPONENTS
   ═══════════════════════════════════════ */
.card {
  background: var(--surface-container-low);
  border-radius: 0.75rem; padding: 1.25rem;
  margin-bottom: 0.75rem;
}

.ar7-border { border-left: 4px solid var(--primary-container); }

.details-block summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between;
  padding: 1rem; cursor: pointer; transition: background 0.2s;
}
.details-block summary::-webkit-details-marker { display: none; }
.details-block summary:hover { background: var(--surface-container); }

.input-field {
  width: 100%; background: var(--surface-container-low); border: none;
  border-radius: 0.5rem; padding: 1rem; font-family: var(--font-headline);
  font-weight: bold; font-size: 1.5rem; color: var(--primary-container);
  outline: none; transition: ring 0.2s;
}
.input-field:focus { box-shadow: 0 0 0 2px var(--primary-container); }

.btn-primary {
  width: 100%; background: linear-gradient(135deg, var(--primary-container), var(--primary));
  color: var(--on-primary-container); font-family: var(--font-headline);
  font-weight: 900; padding: 1rem; border-radius: 0.75rem; border: none;
  text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
  box-shadow: 0 8px 20px -4px rgba(202, 253, 0, 0.4); transition: transform 0.1s;
}
.btn-primary:active { transform: scale(0.98); }

/* ═══════════════════════════════════════
     SLIDE PAGES & MODALS
   ═══════════════════════════════════════ */
.slide-page { 
  position: fixed; inset: 0; background: var(--background); z-index: 200;
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto; 
}
.slide-page.open { transform: translateX(0); }

.modal-overlay { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300;
  display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  opacity: 0; pointer-events: none; transition: opacity 0.25s; 
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal-card { 
  background: var(--surface-container-high); width: 100%; max-width: 24rem;
  border-radius: 1.25rem; padding: 2rem; border: 1px solid rgba(255,255,255,0.1);
  transform: translateY(20px); transition: transform 0.25s;
}
.modal-overlay.open .modal-card { transform: translateY(0); }

/* ═══════════════════════════════════════
     REST TIMER STYLES
   ═══════════════════════════════════════ */
.timer-bubble { 
  position: fixed; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); 
  right: 20px; z-index: 60; cursor: pointer; transition: opacity 0.3s;
}
.timer-bubble.scroll-fade { opacity: 0.35; }

.timer-panel { 
  position: fixed; bottom: calc(180px + env(safe-area-inset-bottom, 0px)); 
  right: 20px; background: var(--surface-container-low); 
  border: 1px solid #222; border-radius: 12px; padding: 10px; z-index: 60;
  opacity: 0; pointer-events: none; transform: translateY(8px) scale(0.97);
  transition: all 0.15s; display: flex; flex-direction: column; gap: 8px;
}
.timer-panel.show { opacity: 1; pointer-events: all; transform: none; }

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around;
  align-items: flex-end; padding: 0.5rem 1rem 1.5rem 1rem; z-index: 50;
  background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.05); border-radius: 2rem 2rem 0 0;
}
.nav-btn {
  background: none; border: none; color: var(--on-surface-variant);
  display: flex; flex-direction: column; align-items: center; cursor: pointer;
}
.nav-btn.active-main {
  background: var(--primary-container); color: black; border-radius: 50%;
  width: 3.5rem; height: 3.5rem; justify-content: center; transform: translateY(-5px);
  box-shadow: 0 0 15px rgba(202,253,0,0.4);
}
</style>
</head>

<body>

<header class="app-bar">
  <div style="display:flex; align-items:center; gap:12px;">
    <span class="material-symbols-outlined" style="color:var(--primary-container)">calendar_today</span>
    <h1 id="headerDate" style="font-family:var(--font-headline); font-size:1.25rem; margin:0; color:var(--primary)">AR-7 Program</h1>
  </div>
  <span class="material-symbols-outlined" style="color:var(--on-surface-variant); cursor:pointer">settings</span>
</header>

<div id="mainView">
  <div class="tab-bar">
    <div class="tabs-scroll" id="tabs"></div>
  </div>
  <main class="content-area" id="content"></main>
</div>

<div class="timer-bubble" id="timerBubble">
  <div style="position:relative; width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#111; border:1px solid #222; box-shadow:0 10px 30px rgba(0,0,0,0.5)">
    <svg style="position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)">
      <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(202,253,0,0.1)" stroke-width="3.5"/>
      <circle id="timerArc" cx="40" cy="40" r="35" fill="none" stroke="var(--primary-container)" stroke-dasharray="219.9" stroke-dashoffset="219.9" stroke-linecap="round" stroke-width="3.5" style="transition:stroke-dashoffset 0.5s linear"/>
    </svg>
    <div style="display:flex; flex-direction:column; align-items:center; z-index:1">
      <span id="timerDisplay" style="font-family:var(--font-headline); font-weight:bold; color:var(--primary-container)">REST</span>
      <span id="timerStatus" style="font-size:8px; text-transform:uppercase; color:var(--on-surface-variant)">TAP</span>
    </div>
  </div>
</div>

<div class="timer-panel" id="timerPanel">
  <button id="timerResetBtn" style="background:var(--surface-container-high); border:1px solid #333; color:white; padding:8px 16px; border-radius:8px">Reset</button>
  <button id="timerStopBtn" style="background:var(--surface-container-high); border:1px solid #333; color:var(--error); padding:8px 16px; border-radius:8px">Stop</button>
</div>

<nav class="bottom-nav">
  <button id="navWorkout" class="nav-btn active-main">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">fitness_center</span>
  </button>
  <button id="navTools" class="nav-btn">
    <span class="material-symbols-outlined">calculate</span>
    <span style="font-size:10px; margin-top:4px">TOOLS</span>
  </button>
  <button id="navNotes" class="nav-btn">
    <span class="material-symbols-outlined">description</span>
    <span style="font-size:10px; margin-top:4px">PROGRAM</span>
  </button>
</nav>

<div class="slide-page" id="progPage">
    <header style="padding:1rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222">
        <h2 style="font-family:var(--font-headline); margin:0">Program Notes</h2>
        <button id="progPageClose" style="background:none; border:none; color:white"><span class="material-symbols-outlined">close</span></button>
    </header>
    <main style="padding:2rem">
        </main>
</div>

<div class="slide-page" id="strengthPage">
    <header style="padding:1rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222">
        <h2 style="font-family:var(--font-headline); margin:0">Calculator</h2>
        <button id="strengthPageClose" style="background:none; border:none; color:white"><span class="material-symbols-outlined">close</span></button>
    </header>
    <main style="padding:2rem">
        <div class="card">
            <label style="font-size:10px; color:var(--on-surface-variant)">WEIGHT (LB)</label>
            <input id="calcWeight" type="number" class="input-field" placeholder="225">
            <label style="font-size:10px; color:var(--on-surface-variant); margin-top:1rem; display:block">REPS</label>
            <input id="calcReps" type="number" class="input-field" placeholder="5">
            <button id="calcBtn" class="btn-primary" style="margin-top:1.5rem">Calculate</button>
        </div>
        <div id="calcResults" style="display:none; margin-top:2rem">
            <div style="text-align:center; margin-bottom:1rem">
                <p style="font-size:10px; color:var(--on-surface-variant)">ESTIMATED 1RM</p>
                <h1 id="calcOrm" style="font-family:var(--font-headline); font-size:4rem; margin:0; color:var(--primary-container)">--</h1>
            </div>
            <div id="calcRows"></div>
        </div>
        <div id="baselinesSection" style="margin-top:2rem"></div>
    </main>
</div>

<div class="modal-overlay" id="baselineModal">
    <div class="modal-card">
        <h3 id="modalLiftName" style="margin-top:0">Lift Name</h3>
        <input id="modalWeight" type="number" class="input-field" placeholder="Weight">
        <input id="modalReps" type="number" class="input-field" placeholder="Reps" style="margin-top:1rem">
        <p id="modalOrmPreview" style="font-size:12px; color:var(--on-surface-variant)"></p>
        <button id="modalSaveBtn" class="btn-primary">Save</button>
        <button id="modalCancelBtn" style="width:100%; background:none; border:none; color:var(--on-surface-variant); margin-top:1rem">Cancel</button>
    </div>
</div>

</script>
</body>
</html>
